<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastrar Produto</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/modern-normalize/modern-normalize.css"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <app-header titulo="Cadastrar Produto"></app-header>
    <app-nav></app-nav>
    <main>
      <div class="p_estoque">
        <a href="estoque.html">Consulta</a>
        <a href="create.html">Adicionar</a>
        <a href="delete.html">Deletar</a>
        <a href="update.html">Editar</a>
      </div>

      <h2>Cadastrar Produto</h2>

      <form id="form-create">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" maxlength="100" required />

        <label for="codigo_p">Código:</label>
        <input type="text" id="codigo_p" maxlength="20" placeholder="Gerado automaticamente se vazio" />

        <label for="id_categorias">Categoria:</label>
        <select id="id_categorias" required>
          <option value="">Selecione uma categoria</option>
        </select>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao"></textarea>

        <label for="preco_custo">Preço de custo:</label>
        <input type="number" id="preco_custo" step="0.01" required />

        <label for="preco_venda">Preço de venda:</label>
        <input type="number" id="preco_venda" step="0.01" required />

        <label for="qtd">Quantidade:</label>
        <input type="number" id="qtd" value="0" required />

        <label for="estoque_min">Estoque mínimo:</label>
        <input type="number" id="estoque_min" value="0" required />

        <button type="submit">Cadastrar</button>
      </form>
    </main>

    <app-footer></app-footer>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
