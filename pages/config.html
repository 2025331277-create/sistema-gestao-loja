<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Início | Sistema de Gestão de Loja</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/modern-normalize/modern-normalize.css"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header>
      <h1>Sistema de Gestão de Loja</h1>
    </header>

    <nav>
      <a href="inicio.html">Início</a>
      <a href="estoque.html">Estoque</a>
      <a href="financeiro.html">Financeiro</a>
      <a href="clientes.html">Clientes</a>
      <a href="fornecedores.html">Fornecedores</a>
      <a href="config.html">Configurações</a>
    </nav>
    <main>
      <h2>Configurações</h2>

      <h3>Dados da Loja</h3>

      <form id="form-config-loja">
        <input type="hidden" id="id_loja" value="1" />

        <label for="nome">Nome:</label>
        <input type="text" id="nome" required />

        <label for="cnpj">CNPJ:</label>
        <input type="text" id="cnpj" />

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" />

        <label for="email">E-mail:</label>
        <input type="email" id="email" />

        <label for="endereco">Endereço:</label>
        <textarea id="endereco"></textarea>

        <button type="submit">Salvar Configurações</button>
      </form>

      <h3>Usuários de Acesso</h3>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Cargo</th>
            <th>E-mail</th>
          </tr>
        </thead>
        <tbody id="lista-usuarios"></tbody>
      </table>
    </main>

    <footer>
      <p>Sistema de Gestão de Loja</p>
    </footer>
  </body>
</html>
