<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações | Sistema de Gestão de Loja</title>
    <link rel="stylesheet" href="https://unpkg.com/modern-normalize/modern-normalize.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <app-header titulo="Configurações"></app-header>
    <app-nav></app-nav>

    <main>
      <h2>Configurações</h2>

      <h3>Dados da Loja</h3>

      <form id="form-loja">
        <input type="hidden" id="loja" value="1" />

        <label for="nome">Nome:</label>
        <input type="text" id="nome" maxlength="45" required />

        <label for="cnpj">CNPJ:</label>
        <input type="text" id="cnpj" maxlength="14" />

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" maxlength="20" />

        <label for="email">E-mail:</label>
        <input type="email" id="email" maxlength="100" />

        <label for="endereco">Endereço:</label>
        <textarea id="endereco"></textarea>

        <button type="submit">Salvar Configurações</button>
      </form>

      <h3>Novo Usuário</h3>

      <form id="form-usuario">
        <label for="cargo">Cargo:</label>
        <input type="text" id="cargo" maxlength="30" required />

        <label for="email-usuario">E-mail:</label>
        <input type="email" id="email-usuario" maxlength="100" required />

        <label for="senha">Senha:</label>
        <input type="password" id="senha" maxlength="12" required />

        <button type="submit">Cadastrar Usuário</button>
      </form>

      <input type="search" id="busca-usuarios" placeholder="Pesquisar usuário" />

      <h3>Usuários de Acesso</h3>

      <table>
        <thead>
          <tr>
            <th>Cargo</th>
            <th>E-mail</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-usuarios"></tbody>
      </table>
    </main>

    <app-footer></app-footer>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
