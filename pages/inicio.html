<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Início | Sistema de Gestão de Loja</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/modern-normalize/modern-normalize.css"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header>
      <h1>Sistema de Gestão de Loja</h1>
    </header>

    <nav>
      <a href="inicio.html">Início</a>
      <a href="estoque.html">Estoque</a>
      <a href="financeiro.html">Financeiro</a>
      <a href="clientes.html">Clientes</a>
      <a href="fornecedores.html">Fornecedores</a>
      <a href="config.html">Configuraçoes</a>
    </nav>

    <main>
      <h2>Resumo do Negócio</h2>

      <div class="resumo">
        <div class="info">
          <strong>Dinheiro em Caixa</strong>
          <p id="total-caixa">R$ 0,00</p>
        </div>

        <div class="info">
          <strong>Dinheiro na Rua</strong>
          <p id="total-rua">R$ 0,00</p>
        </div>

        <div class="info">
          <strong>Produtos no Estoque</strong>
          <p id="total-produtos">0</p>
        </div>

        <div class="info">
          <strong>Capital em Estoque</strong>
          <p id="valor-estoque">R$ 0,00</p>
        </div>
      </div>

      <h2>Dados da Loja</h2>

      <form id="form-loja">
        <input type="hidden" id="id_loja" value="1" />

        <label for="nome">Nome:</label>
        <input type="text" id="nome" required />

        <label for="cnpj">CNPJ:</label>
        <input type="text" id="cnpj" />

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" />

        <label for="email">E-mail:</label>
        <input type="email" id="email" />

        <label for="endereco">Endereço:</label>
        <textarea id="endereco"></textarea>

        <button type="submit">Salvar dados da loja</button>
      </form>
    </main>

    <footer>
      <p>Sistema de Gestão de Loja</p>
    </footer>
  </body>
</html>
