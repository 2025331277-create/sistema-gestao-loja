<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendas | Sistema de Gestão de Loja</title>
    <link rel="stylesheet" href="https://unpkg.com/modern-normalize/modern-normalize.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <app-header titulo="Vendas / PDV"></app-header>
    <app-nav></app-nav>

    <main>
      <h2>Nova Venda</h2>

      <form id="form-cliente-venda">
        <h3>Cliente rápido</h3>

        <label for="nome_cliente">Nome:</label>
        <input type="text" id="nome_cliente" maxlength="100" />

        <label for="cpf_cliente">CPF:</label>
        <input type="text" id="cpf_cliente" maxlength="14" />

        <label for="telefone_cliente">Telefone:</label>
        <input type="text" id="telefone_cliente" maxlength="20" />

        <button type="submit">Cadastrar Cliente</button>
      </form>

      <form id="form-venda">
        <label for="cliente">Cliente:</label>
        <select id="cliente" required>
          <option value="">Selecione um cliente</option>
        </select>

        <label for="forma_pagamento">Forma de pagamento:</label>
        <select id="forma_pagamento" required>
          <option value="">Selecione</option>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão">Cartão</option>
          <option value="Pix">Pix</option>
        </select>

        <label for="parcelas">Parcelas:</label>
        <input type="number" id="parcelas" min="1" step="1" />

        <label for="produto">Produto:</label>
        <select id="produto">
          <option value="">Selecione um produto</option>
        </select>

        <label for="tamanho">Tamanho:</label>
        <select id="tamanho">
          <option value="">Sem tamanho</option>
        </select>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" min="1" step="1" />

        <button type="button" id="adicionar-item">Adicionar Item</button>

        <ul id="lista-itens">
          <li>Nenhum item adicionado.</li>
        </ul>

        <p><strong>Valor total:</strong> <span id="valor-total">R$ 0,00</span></p>

        <button type="submit">Finalizar Venda</button>
      </form>

      <h2>Vendas</h2>
      <input type="search" id="busca-vendas" placeholder="Pesquisar venda" />

      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Valor</th>
            <th>Pagamento</th>
            <th>Parcelas</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-vendas"></tbody>
      </table>
    </main>

    <app-footer></app-footer>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
