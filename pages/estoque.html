<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estoque | Sistema de Gestão de Loja</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/modern-normalize/modern-normalize.css"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <app-header></app-header>
    <app-nav></app-nav>

    <main>
      <div class="p_estoque">
        <a href="estoque.html">Consulta</a>
        <a href="create.html">Adicionar</a>
        <a href="delete.html">Deletar</a>
        <a href="update.html">Editar</a>
      </div>

      <h2>Produtos Cadastrados</h2>

      <input type="search" id="busca-produtos" placeholder="Pesquisar produto" />
      <button id="btn-read" type="button">Consultar Produtos</button>

      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Código</th>
            <th>Categoria</th>
            <th>Preço de custo</th>
            <th>Preço de venda</th>
            <th>Quantidade</th>
            <th>Estoque mínimo</th>
            <th>Data de criação</th>
          </tr>
        </thead>

        <tbody id="lista-produtos"></tbody>
      </table>

      <hr />

      <h2>Categorias</h2>

      <form id="form-categoria">
        <label for="nome-categoria">Nome:</label>
        <input type="text" id="nome-categoria" maxlength="30" required />

        <label for="descricao-categoria">Descrição:</label>
        <textarea id="descricao-categoria"></textarea>

        <button type="submit">Cadastrar Categoria</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-categorias">
          <tr>
            <td colspan="3">Nenhuma categoria cadastrada.</td>
          </tr>
        </tbody>
      </table>
    </main>

    <app-footer></app-footer>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
