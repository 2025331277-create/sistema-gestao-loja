<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Início | Sistema de Gestão de Loja</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/modern-normalize/modern-normalize.css"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header>
      <h1>Sistema de Gestão de Loja</h1>
    </header>

    <nav>
      <a href="inicio.html">Início</a>
      <a href="estoque.html">Estoque</a>
      <a href="financeiro.html">Financeiro</a>
      <a href="clientes.html">Clientes</a>
      <a href="fornecedores.html">Fornecedores</a>
      <a href="config.html">Configurações</a>
    </nav>
    <main>
      <h2>Controle Financeiro</h2>

      <div class="resumo">
        <div class="info">
          <strong>Recebido</strong>
          <p id="total-recebido">R$ 0,00</p>
        </div>

        <div class="info">
          <strong>A Receber</strong>
          <p id="total-pendente">R$ 0,00</p>
        </div>

        <div class="info">
          <strong>Total de Vendas</strong>
          <p id="total-vendas">0</p>
        </div>
      </div>

      <h3>Vendas</h3>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Valor</th>
            <th>Pagamento</th>
            <th>Parcelas</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="lista-vendas"></tbody>
      </table>

      <h3>Pagamentos</h3>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Código</th>
            <th>Valor</th>
            <th>Contato</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="lista-pagamentos"></tbody>
      </table>
    </main>

    <footer>
      <p>Sistema de Gestão de Loja</p>
    </footer>
  </body>
</html>
