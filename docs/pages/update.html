<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Alterar Produto</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/modern-normalize/modern-normalize.css"
    />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <app-header></app-header>
    <app-nav></app-nav>

    <main>
      <div class="p_estoque">
        <a href="estoque.html">Consulta</a>
        <a href="create.html">Adicionar</a>
        <a href="delete.html">Deletar</a>
        <a href="update.html">Editar</a>
      </div>
      <h2>Alterar Produto</h2>

      <form id="form-update">
        <label>ID do Produto:</label>
        <input type="number" id="id" required />

        <label>Nome:</label>
        <input type="text" id="nome" required />

        <label>Código:</label>
        <input type="text" id="codigo_p" required />

        <label>Preço de custo:</label>
        <input type="number" id="preco_custo" step="0.01" required />

        <label>Preço de venda:</label>
        <input type="number" id="preco_venda" step="0.01" required />

        <label>Quantidade:</label>
        <input type="number" id="qtd" required />

        <button type="submit">Salvar Alterações</button>
      </form>
    </main>

    <app-footer></app-footer>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
