
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>

    <h1>Cadastro da loja</h1>

    <form id="form-cadastro">

        <input type="text" id="nome" placeholder="Nome da loja" required>
        <input type="text" id="cnpj" placeholder="CNPJ">
        <input type="text" id="telefone" placeholder="Telefone">
        <input type="email" id="email-loja" placeholder="E-mail da loja">
        <input type="text" id="endereco" placeholder="Endereço">

        <h2>Dados de acesso</h2>

        <input type="email" id="email" placeholder="E-mail de acesso" required>
        <input type="password" id="senha" placeholder="Senha de acesso" required>

        <button type="submit">Cadastrar</button>

    </form>

    <p>Já possui uma conta? <a href="index.html">Entrar</a></p>

    <script type="module" src="js/cadastro.js"></script>

</body>
</html>
